<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Getzner · Gleislagerung 3D</title>
<style>
:root {
  --getzner: #3d9a6a;
  --getzner-light: #5cb87e;
  --danger: #c45c3e;
  --ink: #0a0c0b;
  --paper: #f4f0e6;
  --muted: #9a958c;
}
* { box-sizing: border-box; margin: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--ink);
  color: var(--paper);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
#viewport { display: block; width: 100vw; height: 100vh; touch-action: none; }
.hud {
  position: fixed; inset: 0; pointer-events: none;
  display: flex; flex-direction: column;
  padding: clamp(8px, 2vh, 24px) clamp(12px, 2.5vw, 32px);
}
.hud-top {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;
  flex-wrap: wrap;
}
.brand h1 {
  font-size: clamp(1rem, 2.2vw, 1.75rem);
  font-weight: 700;
  letter-spacing: 0.03em;
}
.brand h1 span { color: var(--getzner-light); }
.brand p { color: var(--muted); font-size: clamp(0.7rem, 1.2vw, 1rem); margin-top: 4px; }
.meters {
  display: flex; gap: clamp(8px, 1.5vw, 20px);
  flex-wrap: wrap;
}
.meter {
  background: rgba(10, 12, 11, 0.75);
  border: 1px solid rgba(244, 240, 230, 0.15);
  border-radius: 10px;
  padding: 10px 16px;
  min-width: 120px;
  backdrop-filter: blur(8px);
}
.meter label {
  display: block;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 4px;
}
.meter .val {
  font-size: clamp(1.2rem, 2.5vw, 2rem);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.meter .val.high { color: #e88a6a; }
.meter .val.low { color: var(--getzner-light); }
.meter .zone {
  font-size: 0.75rem;
  margin-top: 2px;
  font-weight: 600;
}
.meter .zone.a { color: #e88a6a; }
.meter .zone.b { color: var(--getzner-light); }
.hud-bottom {
  margin-top: auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  pointer-events: auto;
}
.controls {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
  background: rgba(10, 12, 11, 0.82);
  border: 1px solid rgba(61, 154, 106, 0.35);
  border-radius: 12px;
  padding: 12px 18px;
  backdrop-filter: blur(10px);
}
.controls label { font-weight: 600; font-size: clamp(0.85rem, 1.4vw, 1.1rem); }
input[type="range"] {
  width: min(280px, 35vw);
  accent-color: var(--getzner);
  height: 6px;
}
.speed-disp {
  font-weight: 800;
  color: var(--getzner-light);
  min-width: 5.5ch;
  font-size: clamp(1rem, 2vw, 1.5rem);
}
.btn {
  pointer-events: auto;
  cursor: pointer;
  border: 1px solid rgba(244, 240, 230, 0.2);
  background: rgba(61, 154, 106, 0.2);
  color: var(--paper);
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.9rem;
}
.btn:hover, .btn.active { background: var(--getzner); border-color: var(--getzner-light); }
.legend {
  display: flex;
  gap: 1.25rem;
  font-size: clamp(0.75rem, 1.2vw, 0.95rem);
  background: rgba(10, 12, 11, 0.7);
  padding: 8px 14px;
  border-radius: 8px;
}
.legend span { display: flex; align-items: center; gap: 6px; }
.swatch { width: 12px; height: 12px; border-radius: 2px; }
.swatch.r { background: var(--danger); }
.swatch.g { background: var(--getzner); }
.section-banner {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  font-size: clamp(1.5rem, 4vw, 3rem);
  font-weight: 800;
  opacity: 0;
  transition: opacity 0.35s, transform 0.35s;
  text-shadow: 0 4px 24px rgba(0,0,0,0.8);
  pointer-events: none;
  z-index: 5;
}
.section-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.section-banner.red { color: #f0a090; }
.section-banner.green { color: var(--getzner-light); }
.mode-panel {
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
}
.mode-state {
  font-size: clamp(1.4rem, 3.5vw, 2.4rem);
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  transition: color 0.4s;
  text-shadow: 0 2px 16px rgba(0,0,0,0.7);
}
.mode-state.ohne { color: #e88a6a; }
.mode-state.mit { color: var(--getzner-light); }
.mode-toggle {
  display: flex;
  width: min(100%, 480px);
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid rgba(244, 240, 230, 0.25);
  box-shadow: 0 8px 32px rgba(0,0,0,0.45);
}
.mode-toggle button {
  flex: 1;
  cursor: pointer;
  border: none;
  padding: clamp(14px, 2.5vh, 22px) clamp(12px, 2vw, 24px);
  font-size: clamp(0.95rem, 2vw, 1.25rem);
  font-weight: 800;
  letter-spacing: 0.03em;
  transition: background 0.35s, color 0.35s, transform 0.2s;
  color: rgba(244, 240, 230, 0.55);
  background: rgba(20, 22, 20, 0.85);
}
.mode-toggle button:hover { color: var(--paper); }
.mode-toggle button.active-ohne {
  background: linear-gradient(135deg, #8b3a28, #c45c3e);
  color: #fff;
}
.mode-toggle button.active-mit {
  background: linear-gradient(135deg, #2a6b4a, var(--getzner));
  color: #fff;
}
.mode-hint {
  font-size: 0.8rem;
  color: var(--muted);
}
.house-meter {
  background: rgba(10, 12, 11, 0.75);
  border: 1px solid rgba(244, 240, 230, 0.15);
  border-radius: 10px;
  padding: 10px 16px;
  min-width: 140px;
  backdrop-filter: blur(8px);
}
.house-meter label {
  display: block;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  margin-bottom: 4px;
}
.house-meter .val {
  font-size: clamp(1.1rem, 2.2vw, 1.6rem);
  font-weight: 800;
}
.house-meter .val.high { color: #e88a6a; }
.house-meter .val.low { color: var(--getzner-light); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="viewport"></canvas>
<div class="hud">
  <div class="hud-top">
    <div class="brand">
      <h1>Getzner <span>Schwingungsschutz</span></h1>
      <p>Vorher-Nachher · Zugdemo am Nachbarhaus</p>
    </div>
    <div class="house-meter">
      <label>Nachbarhaus</label>
      <span class="val high" id="houseVal">Stark belastet</span>
    </div>
  </div>
  <div class="mode-panel">
    <div class="mode-state ohne" id="modeState">Ohne Getzner</div>
    <div class="mode-toggle" id="modeToggle" role="group" aria-label="Getzner Modus">
      <button type="button" id="btnOhne" class="active-ohne">Ohne Getzner</button>
      <button type="button" id="btnMit">Mit Getzner</button>
    </div>
    <span class="mode-hint">Umschalten · Leertaste</span>
  </div>
  <div class="hud-bottom">
    <div class="controls">
      <label for="speed">Geschwindigkeit</label>
      <input type="range" id="speed" min="30" max="160" value="80" step="5">
      <span class="speed-disp" id="speedDisp">80 km/h</span>
      <button type="button" class="btn active" id="camFollow">Kamera: Verfolgung</button>
      <button type="button" class="btn" id="camSide">Kamera: Seite</button>
    </div>
  </div>
</div>
<div class="section-banner red" id="banner"></div>
<script type="module">
import * as THREE from "three";

const KM = 1000;
const TOTAL = KM * 2;
const GETZNER = 0x3d9a6a;
const GETZNER_DARK = 0x2a6b4a;

const speedEl = document.getElementById("speed");
const speedDisp = document.getElementById("speedDisp");
const houseVal = document.getElementById("houseVal");
const modeState = document.getElementById("modeState");
const btnOhne = document.getElementById("btnOhne");
const btnMit = document.getElementById("btnMit");
const banner = document.getElementById("banner");
const camFollow = document.getElementById("camFollow");
const camSide = document.getElementById("camSide");
const canvas = document.getElementById("viewport");

let trainZ = KM * 0.35;
let cameraMode = "side";
let wobbleT = 0;
let ripplePool = [];
let getznerOn = false;
let modeBlend = 0;
const elastomers = [];
const houseWindows = [];
let groundStressStrip = null;

function kmh() { return Number(speedEl.value); }
function mPerSec() { return kmh() / 3.6; }

speedEl.addEventListener("input", () => {
  speedDisp.textContent = speedEl.value + " km/h";
});

camFollow.addEventListener("click", () => {
  cameraMode = "follow";
  camFollow.classList.add("active");
  camSide.classList.remove("active");
});
camSide.addEventListener("click", () => {
  cameraMode = "side";
  camSide.classList.add("active");
  camFollow.classList.remove("active");
});
camSide.classList.add("active");
camFollow.classList.remove("active");

function applyModeUI() {
  btnOhne.classList.toggle("active-ohne", !getznerOn);
  btnMit.classList.toggle("active-mit", getznerOn);
  modeState.textContent = getznerOn ? "Mit Getzner" : "Ohne Getzner";
  modeState.className = "mode-state " + (getznerOn ? "mit" : "ohne");
  const lbl = getznerOn ? "Mit Getzner — Haus geschützt" : "Ohne Getzner — starke Erschütterung";
  banner.textContent = lbl;
  banner.className = "section-banner show " + (getznerOn ? "green" : "red");
  setTimeout(() => banner.classList.remove("show"), 1600);
}

function setGetzner(on) {
  if (getznerOn === on) return;
  getznerOn = on;
  applyModeUI();
}

btnOhne.addEventListener("click", () => setGetzner(false));
btnMit.addEventListener("click", () => setGetzner(true));
window.addEventListener("keydown", (e) => {
  if (e.code !== "Space") return;
  const tag = e.target && e.target.tagName;
  if (tag && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(tag)) return;
  e.preventDefault();
  setGetzner(!getznerOn);
});

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8d8);
scene.fog = new THREE.Fog(0xa8c8e0, 80, 420);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 600);
camera.position.set(14, 4.5, 8);

const hemi = new THREE.HemisphereLight(0xc8e4ff, 0x3a5a30, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e0, 1.35);
sun.position.set(40, 65, -30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60;
sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60;
sun.shadow.camera.bottom = -60;
sun.shadow.camera.near = 5;
sun.shadow.camera.far = 200;
scene.add(sun);

const groundGroup = new THREE.Group();
scene.add(groundGroup);

function makeGround() {
  const geo = new THREE.PlaneGeometry(TOTAL + 200, 120, 1, 1);
  geo.rotateX(-Math.PI / 2);
  const matA = new THREE.MeshLambertMaterial({ color: 0x4a7a42 });
  const matB = new THREE.MeshLambertMaterial({ color: 0x528a48 });
  const ground = new THREE.Mesh(geo, matA);
  ground.position.set(TOTAL / 2, 0, 0);
  ground.receiveShadow = true;
  groundGroup.add(ground);

  groundStressStrip = new THREE.Mesh(
    new THREE.PlaneGeometry(TOTAL, 20),
    new THREE.MeshLambertMaterial({ color: 0x5a4038, emissive: 0x401810, emissiveIntensity: 0.1 })
  );
  groundStressStrip.rotateX(-Math.PI / 2);
  groundStressStrip.position.set(TOTAL / 2, 0.02, 12);
  groundGroup.add(groundStressStrip);
}
makeGround();

const trackGroup = new THREE.Group();
scene.add(trackGroup);

const railMat = new THREE.MeshStandardMaterial({ color: 0x8a9098, metalness: 0.85, roughness: 0.35 });
const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x3d3528, roughness: 0.9 });
const ballastMat = new THREE.MeshStandardMaterial({ color: 0x5c5650, roughness: 0.95 });
const elastMat = new THREE.MeshStandardMaterial({
  color: GETZNER,
  roughness: 0.7,
  emissive: GETZNER_DARK,
  emissiveIntensity: 0.22,
  transparent: true,
  opacity: 0
});

const sleeperStep = 0.65;
const sleepers = [];

for (let z = -20; z < TOTAL + 20; z += sleeperStep) {
  const sw = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.12, 0.22), sleeperMat);
  sw.position.set(0, 0.18, z);
  sw.castShadow = true;
  sw.receiveShadow = true;
  trackGroup.add(sw);
  sleepers.push({ mesh: sw, z });

  const bal = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.08, 0.5), ballastMat);
  bal.position.set(0, 0.1, z);
  bal.receiveShadow = true;
  trackGroup.add(bal);

  if (z % 1.3 < sleeperStep) {
    const el = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.07, 0.38), elastMat.clone());
    el.position.set(0, 0.055, z);
    el.receiveShadow = true;
    trackGroup.add(el);
    elastomers.push(el);
  }
}

function addRail(offsetX, z0, z1) {
  const len = z1 - z0;
  const rail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, len), railMat);
  rail.position.set(offsetX, 0.28, (z0 + z1) / 2);
  rail.castShadow = true;
  trackGroup.add(rail);
}
addRail(-0.72, -20, TOTAL + 20);
addRail(0.72, -20, TOTAL + 20);

const kmMarker = new THREE.Group();
[-0, KM, TOTAL].forEach((z, i) => {
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 1.2, 8), sleeperMat);
  pole.position.set(-4.5, 0.6, z);
  kmMarker.add(pole);
});
scene.add(kmMarker);

const train = new THREE.Group();
scene.add(train);

const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2a2824, metalness: 0.4, roughness: 0.5 });
const accentMat = new THREE.MeshStandardMaterial({ color: 0xf39500, metalness: 0.3, roughness: 0.4 });
const loco = new THREE.Group();

const locoBody = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.35, 3.2), bodyMat);
locoBody.position.y = 1.1;
locoBody.castShadow = true;
loco.add(locoBody);
const locoCab = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.1, 1.4), accentMat);
locoCab.position.set(0, 1.55, -0.6);
locoCab.castShadow = true;
loco.add(locoCab);
const nose = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1, 1.2), accentMat);
nose.position.set(0, 0.95, 1.9);
nose.castShadow = true;
loco.add(nose);

for (let i = 0; i < 3; i++) {
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.18, 16), new THREE.MeshStandardMaterial({ color: 0x14120e }));
  w.rotation.z = Math.PI / 2;
  w.position.set(i === 1 ? 0 : (i === 0 ? -0.55 : 0.55), 0.32, 1.2 - i * 0.9);
  w.castShadow = true;
  loco.add(w);
}

const headL = new THREE.SpotLight(0xfff8e8, 8, 35, 0.45, 0.5, 1);
headL.position.set(0, 1.2, 2.4);
headL.target.position.set(0, 0.5, 12);
loco.add(headL);
loco.add(headL.target);

train.add(loco);
loco.position.z = 0;

for (let c = 0; c < 3; c++) {
  const car = new THREE.Group();
  const carBody = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.5, 2.8), bodyMat);
  carBody.position.y = 1.05;
  carBody.castShadow = true;
  car.add(carBody);
  const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.72, 0.15, 2.82), accentMat);
  stripe.position.y = 1.35;
  car.add(stripe);
  for (const side of [-0.86, 0.86]) {
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.45), new THREE.MeshStandardMaterial({
      color: 0x88ccee, emissive: 0x224466, emissiveIntensity: 0.3
    }));
    win.position.set(side, 1.15, 0.3);
    win.rotation.y = side < 0 ? -Math.PI / 2 : Math.PI / 2;
    car.add(win);
  }
  for (let w = 0; w < 4; w++) {
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.14, 12), new THREE.MeshStandardMaterial({ color: 0x14120e }));
    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(w % 2 === 0 ? -0.5 : 0.5, 0.28, -0.9 + (w < 2 ? 0 : 1.8));
    car.add(wheel);
  }
  car.position.z = -(c + 1) * 3.1;
  train.add(car);
}

const house = new THREE.Group();
house.position.set(9, 0, 10);
scene.add(house);

const houseBase = new THREE.Mesh(new THREE.BoxGeometry(5, 3.2, 4.5), new THREE.MeshStandardMaterial({ color: 0xd8d0c4 }));
houseBase.position.y = 1.6;
houseBase.castShadow = true;
houseBase.receiveShadow = true;
house.add(houseBase);
const roof = new THREE.Mesh(new THREE.ConeGeometry(3.8, 1.8, 4), new THREE.MeshStandardMaterial({ color: 0x8b3a2a }));
roof.position.y = 4.1;
roof.rotation.y = Math.PI / 4;
roof.castShadow = true;
house.add(roof);
const door = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.6, 0.1), new THREE.MeshStandardMaterial({ color: 0x3a3028 }));
door.position.set(0, 0.8, 2.26);
house.add(door);
for (const wx of [-1.4, 0.5, 1.5]) {
  const hwnd = new THREE.Mesh(
    new THREE.PlaneGeometry(0.85, 0.75),
    new THREE.MeshStandardMaterial({ color: 0xa8d4f0, emissive: 0x335566, emissiveIntensity: 0.25 })
  );
  hwnd.position.set(0, 1.85, 2.28);
  hwnd.position.x = wx;
  house.add(hwnd);
  houseWindows.push({ mesh: hwnd, bx: wx, by: 1.85, bz: 2.28 });
}

const trees = new THREE.Group();
scene.add(trees);
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3528 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d6b32 });

function addTree(x, z, scale = 1) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15 * scale, 0.22 * scale, 2.2 * scale, 6), trunkMat);
  trunk.position.y = 1.1 * scale;
  trunk.castShadow = true;
  g.add(trunk);
  const crown = new THREE.Mesh(new THREE.ConeGeometry(1.1 * scale, 2.8 * scale, 7), leafMat);
  crown.position.y = 3.2 * scale;
  crown.castShadow = true;
  g.add(crown);
  g.position.set(x, 0, z);
  trees.add(g);
}

for (let z = 0; z < TOTAL; z += 35 + Math.random() * 25) {
  addTree(-18 - Math.random() * 8, z, 0.8 + Math.random() * 0.5);
  addTree(22 + Math.random() * 10, z, 0.7 + Math.random() * 0.6);
}

const hills = new THREE.Group();
scene.add(hills);
for (let i = 0; i < 12; i++) {
  const h = new THREE.Mesh(
    new THREE.SphereGeometry(25 + Math.random() * 20, 12, 8),
    new THREE.MeshLambertMaterial({ color: 0x4a8a48 })
  );
  h.scale.y = 0.35;
  h.position.set(-80 + i * 70, -2, 60 + (i % 3) * 40);
  hills.add(h);
}

const rippleGroup = new THREE.Group();
scene.add(rippleGroup);

function spawnRipple(z, towardHouse) {
  const stress = 1 - modeBlend;
  if (stress < 0.15) return;
  const maxR = stress > 0.7 ? 22 : 10;
  if (ripplePool.length > maxR) return;
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.35, 0.55, 28),
    new THREE.MeshBasicMaterial({
      color: towardHouse ? 0xe06040 : 0xe09060,
      transparent: true,
      opacity: 0.55 * stress,
      side: THREE.DoubleSide
    })
  );
  ring.rotation.x = -Math.PI / 2;
  const ox = towardHouse ? 2 + Math.random() * 5 : (Math.random() - 0.5) * 1.2;
  const oz = z + (towardHouse ? 3 + Math.random() * 6 : (Math.random() - 0.5) * 2);
  ring.position.set(ox, 0.06, oz);
  rippleGroup.add(ring);
  ripplePool.push({ mesh: ring, age: 0, spread: towardHouse ? 5.5 : 3.2 });
}

function trackYOffset(z, t, stress) {
  const v = Math.min(1, kmh() / 120);
  const harsh = Math.sin(z * 0.15 + t * 8) * 0.055 * v + Math.sin(z * 0.4 + t * 12) * 0.028 * v;
  const calm = Math.sin(z * 0.08 + t * 2) * 0.003;
  return THREE.MathUtils.lerp(harsh, calm, modeBlend);
}

function updateHud() {
  const stress = 1 - modeBlend;
  houseVal.textContent = stress > 0.45 ? "Stark belastet" : stress > 0.15 ? "Spürbar" : "Ruhig";
  houseVal.className = "val " + (stress > 0.35 ? "high" : "low");
}

function updateVisuals(z, dt) {
  const stress = 1 - modeBlend;
  const v = kmh() / 120;

  if (groundStressStrip) {
    const m = groundStressStrip.material;
    m.color.set(0x5a4038).lerp(new THREE.Color(0x3a6048), modeBlend);
    m.emissive.set(0x401810).lerp(new THREE.Color(0x103820), modeBlend);
    m.emissiveIntensity = THREE.MathUtils.lerp(0.12, 0.04, modeBlend);
  }

  for (const el of elastomers) {
    el.material.opacity = modeBlend * 0.92;
    el.material.emissiveIntensity = 0.08 + modeBlend * 0.2;
    el.visible = modeBlend > 0.02;
  }

  const shake = stress * v;
  house.rotation.z = Math.sin(wobbleT * 4.2) * 0.038 * shake;
  house.rotation.x = Math.cos(wobbleT * 3.7) * 0.02 * shake;
  const houseHomeX = 9;
  house.position.x = houseHomeX + Math.sin(wobbleT * 6) * 0.14 * shake;
  house.position.y = Math.abs(Math.sin(wobbleT * 8)) * 0.1 * shake;
  groundGroup.rotation.z = Math.sin(wobbleT * 7) * 0.004 * shake;
  trackGroup.position.y = Math.sin(wobbleT * 9) * 0.015 * shake;

  for (const w of houseWindows) {
    const j = shake * 0.04;
    w.mesh.position.x = w.bx + Math.sin(wobbleT * 11 + w.bx) * j;
    w.mesh.position.y = w.by + Math.cos(wobbleT * 13) * j * 0.8;
  }

  if (shake > 0.2) {
    if (Math.random() < 0.22 * shake) spawnRipple(z, false);
    if (Math.random() < 0.14 * shake) spawnRipple(z, true);
  }

  house.position.z = z + 6;
  updateHud();
}

let last = performance.now();

function animate(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  wobbleT += dt;

  trainZ += mPerSec() * dt;
  if (trainZ > TOTAL) trainZ -= TOTAL;

  modeBlend = THREE.MathUtils.lerp(modeBlend, getznerOn ? 1 : 0, dt * 2.8);
  const stress = 1 - modeBlend;

  const yo = trackYOffset(trainZ, wobbleT, stress);
  train.position.set(0, 0.32 + yo, trainZ);
  const bob = stress * Math.sin(wobbleT * 10) * 0.035 * (kmh() / 100);
  train.rotation.x = bob;

  updateVisuals(trainZ, dt);

  for (let i = ripplePool.length - 1; i >= 0; i--) {
    const r = ripplePool[i];
    r.age += dt;
    const s = 1 + r.age * r.spread;
    r.mesh.scale.set(s, s, 1);
    r.mesh.material.opacity = Math.max(0, (0.55 * stress) - r.age * 0.45);
    if (r.age > 1.3) {
      rippleGroup.remove(r.mesh);
      r.mesh.geometry.dispose();
      r.mesh.material.dispose();
      ripplePool.splice(i, 1);
    }
  }

  trees.position.z = -trainZ * 0.02;
  hills.position.z = -trainZ * 0.008;

  if (cameraMode === "follow") {
    const target = new THREE.Vector3(4, 2.2, trainZ + 10);
    camera.position.lerp(new THREE.Vector3(-6, 5, trainZ - 18), 0.08);
    camera.lookAt(target);
  } else {
    const target = new THREE.Vector3(2, 2.4, trainZ + 9);
    camera.position.lerp(new THREE.Vector3(13, 4.8, trainZ + 2), 0.07);
    camera.lookAt(target);
  }

  sun.position.x = 40 + trainZ * 0.02;
  sun.target = train;

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(animate);
</script>
