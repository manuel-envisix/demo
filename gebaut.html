<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noch nichts gebaut</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14120e; color: #f4f0e6; font-family: Georgia, sans-serif; }
  main { height: 100%; display: grid; place-items: center; padding: 8vh; box-sizing: border-box; }
  h1 { font-size: clamp(2.4rem, 6vw, 5rem); line-height: 0.95; margin: 0; }
  p { letter-spacing: 0.14em; text-transform: uppercase; color: #f39500; }
</style>
</head>
<body>
<main>
  <div>
    <p>Öffentlich</p>
    <h1>Noch nichts gebaut.</h1>
  </div>
</main>
</body>
</html>
