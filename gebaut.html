<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gleislagerung — Getzner Demo</title>
<style>
:root {
  --ink: #14120e;
  --paper: #f4f0e6;
  --muted: #b7b0a4;
  --orange: #f39500;
  --line: rgba(244, 240, 230, 0.16);
}
* { box-sizing: border-box; margin: 0; }
html, body {
  height: 100%;
  background: var(--ink);
  color: var(--paper);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  overflow: hidden;
}
body {
  display: flex;
  flex-direction: column;
  padding: 2vh 2.5vw;
  background:
    radial-gradient(ellipse at 18% 55%, rgba(243, 149, 0, 0.08), transparent 42%),
    var(--ink);
}
h1 {
  font-size: clamp(1.4rem, 3.2vw, 2.4rem);
  font-weight: 700;
  letter-spacing: 0.02em;
  margin-bottom: 1vh;
}
.sub {
  color: var(--muted);
  font-size: clamp(0.95rem, 1.6vw, 1.25rem);
  margin-bottom: 2vh;
}
.controls {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  flex-wrap: wrap;
  padding: 1.2rem 1.5rem;
  background: rgba(244, 240, 230, 0.06);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 2vh;
}
.controls label {
  font-size: clamp(1rem, 1.8vw, 1.35rem);
  font-weight: 600;
}
input[type="range"] {
  width: min(320px, 40vw);
  accent-color: var(--orange);
  height: 8px;
}
.speed-val {
  font-size: clamp(1.4rem, 2.5vw, 2rem);
  font-weight: 700;
  color: var(--orange);
  min-width: 5ch;
}
.main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr min(22vw, 280px);
  gap: 2vw;
  min-height: 0;
}
.scene-wrap {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  background: linear-gradient(180deg, #1a1814 0%, #0f0e0c 100%);
}
canvas#scene {
  display: block;
  width: 100%;
  height: 100%;
}
.legend {
  display: flex;
  gap: 2rem;
  margin-top: 1vh;
  font-size: clamp(0.85rem, 1.4vw, 1.1rem);
  flex-wrap: wrap;
}
.legend span { display: flex; align-items: center; gap: 0.5rem; }
.dot {
  width: 14px;
  height: 14px;
  border-radius: 3px;
}
.dot.a { background: #c45c3e; }
.dot.b { background: #3d9a6a; }
.house-panel {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  align-self: stretch;
  min-height: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1rem;
  background: rgba(244, 240, 230, 0.04);
}
.house-panel h2 {
  font-size: clamp(1rem, 1.6vw, 1.3rem);
  margin-bottom: 1rem;
  text-align: center;
  color: var(--muted);
}
svg#house {
  width: 100%;
  flex: 1 1 auto;
  min-height: 26vh;
  max-height: min(62vh, 100%);
  overflow: visible;
}
.house-state {
  margin-top: 1rem;
  font-size: clamp(1.1rem, 2vw, 1.5rem);
  font-weight: 700;
  text-align: center;
}
.house-state.wobble { color: #e88a6a; }
.house-state.calm { color: #6bc49a; }
</style>
</head>
<body>
<h1>Getzner Demo — Gleislagerung</h1>
<p class="sub">2 × 1&nbsp;km Strecke · Abschnitt 1 ohne · Abschnitt 2 mit Gleislagerung (illustrativ)</p>
<div class="controls">
  <label for="speed">Geschwindigkeit</label>
  <input type="range" id="speed" min="20" max="160" value="80" step="5">
  <span class="speed-val" id="speedDisp">80 km/h</span>
</div>
<div class="main">
  <div>
    <div class="scene-wrap" id="wrap">
      <canvas id="scene"></canvas>
    </div>
    <div class="legend">
      <span><i class="dot a"></i> km 0–1: ohne Gleislagerung</span>
      <span><i class="dot b"></i> km 1–2: mit Gleislagerung</span>
    </div>
  </div>
  <aside class="house-panel">
    <h2>Nachbarhaus an der Strecke</h2>
    <svg id="house" viewBox="-30 5 260 265" preserveAspectRatio="xMidYMid meet" aria-label="Haus">
      <g id="houseGroup">
        <rect x="28" y="108" width="144" height="108" fill="#2a2824" stroke="#f4f0e6" stroke-width="2.5"/>
        <polygon points="100,28 188,108 12,108" fill="#3a3630" stroke="#f39500" stroke-width="2.5"/>
        <rect x="78" y="148" width="36" height="68" fill="#1a1814" stroke="#b7b0a4" stroke-width="1.5"/>
        <rect x="126" y="132" width="34" height="34" fill="#1a1814" stroke="#b7b0a4" stroke-width="1.5"/>
        <rect x="40" y="132" width="34" height="34" fill="#1a1814" stroke="#b7b0a4" stroke-width="1.5"/>
        <rect x="40" y="178" width="34" height="34" fill="#1a1814" stroke="#b7b0a4" stroke-width="1.5"/>
        <rect x="126" y="178" width="34" height="34" fill="#1a1814" stroke="#b7b0a4" stroke-width="1.5"/>
        <line x1="28" y1="216" x2="172" y2="216" stroke="#b7b0a4" stroke-width="2" opacity="0.5"/>
      </g>
    </svg>
    <p class="house-state wobble" id="houseState">Wackelt — ungelagerter Abschnitt</p>
  </aside>
</div>
<script>
(function () {
  const KM_PX = 900;
  const TOTAL_KM = 2;
  const speedEl = document.getElementById("speed");
  const speedDisp = document.getElementById("speedDisp");
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("wrap");
  const houseGroup = document.getElementById("houseGroup");
  const houseState = document.getElementById("houseState");

  let trainX = 0;
  let last = performance.now();
  let wobblePhase = 0;

  function kmh() { return Number(speedEl.value); }
  function pxPerSec() { return (kmh() / 3.6) * (KM_PX / 1000); }

  speedEl.addEventListener("input", () => {
    speedDisp.textContent = speedEl.value + " km/h";
  });

  function resize() {
    const r = wrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(r.width * dpr);
    canvas.height = Math.floor(r.height * dpr);
    canvas.style.width = r.width + "px";
    canvas.style.height = r.height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  function sectionAtX(x) {
    return x / KM_PX < 1 ? "ungelagert" : "gelagert";
  }

  function drawTrack(w, h) {
    const y = h * 0.62;
    const totalW = TOTAL_KM * KM_PX;
    const scale = Math.min(1, (w - 80) / totalW);
    const ox = 40;
    const oy = y;
    const sec = sectionAtX(trainX);
    const ungelagert = sec === "ungelagert";
    const amp = ungelagert ? Math.min(18, 4 + kmh() * 0.08) : 0.5;

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, 1);

    ctx.fillStyle = "rgba(183, 176, 164, 0.15)";
    ctx.fillRect(0, -8, KM_PX, 16);
    ctx.fillStyle = "rgba(61, 154, 106, 0.22)";
    ctx.fillRect(KM_PX, -8, KM_PX, 16);

    ctx.strokeStyle = "#b7b0a4";
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = 0; x <= totalW; x += 4) {
      const localKm = x / KM_PX;
      let dy = 0;
      if (localKm < 1) {
        dy = Math.sin(x * 0.04 + wobblePhase) * amp + Math.sin(x * 0.11) * (amp * 0.4);
      } else {
        dy = Math.sin(x * 0.02) * 0.4;
      }
      if (x === 0) ctx.moveTo(x, dy);
      else ctx.lineTo(x, dy);
    }
    ctx.stroke();

    ctx.setLineDash([12, 8]);
    ctx.strokeStyle = "rgba(243, 149, 0, 0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(KM_PX, -30);
    ctx.lineTo(KM_PX, 30);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = "#f4f0e6";
    ctx.font = "bold 22px system-ui, sans-serif";
    ctx.fillText("0 km", 8, -36);
    ctx.fillText("1 km", KM_PX + 8, -36);
    ctx.fillText("2 km", totalW - 48, -36);
    ctx.font = "600 20px system-ui, sans-serif";
    ctx.fillStyle = "#e88a6a";
    ctx.fillText("ohne Gleislagerung", 100, -58);
    ctx.fillStyle = "#6bc49a";
    ctx.fillText("mit Gleislagerung", KM_PX + 90, -58);

    const tx = trainX;
    const tkm = tx / KM_PX;
    let trainDy = 0;
    if (tkm < 1) {
      trainDy = Math.sin(tx * 0.04 + wobblePhase) * amp + Math.sin(tx * 0.11) * (amp * 0.4);
    } else {
      trainDy = Math.sin(tx * 0.02) * 0.4;
    }

    const bw = 72, bh = 28;
    ctx.save();
    ctx.translate(tx, trainDy);
    const bob = ungelagert ? Math.sin(wobblePhase * 2.2) * (kmh() * 0.02) : 0;
    ctx.rotate(bob * 0.015);
    ctx.fillStyle = "#f39500";
    ctx.fillRect(-bw / 2, -bh - 8, bw, bh);
    ctx.fillStyle = "#2a2824";
    ctx.fillRect(-bw / 2 + 6, -bh - 4, bw - 12, bh - 10);
    ctx.fillStyle = "#c45c3e";
    ctx.fillRect(bw / 2 - 14, -bh - 2, 12, bh - 6);
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.arc(i * 22, 6, 7, 0, Math.PI * 2);
      ctx.fillStyle = "#14120e";
      ctx.fill();
      ctx.strokeStyle = "#b7b0a4";
      ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }

  function updateHouse(section) {
    const v = kmh();
    const shake = section === "ungelagert";
    let dx = 0, dy = 0, rot = 0;
    if (shake) {
      const s = Math.min(1, v / 120);
      dx = Math.sin(wobblePhase * 1.7) * (8 + s * 14);
      dy = Math.cos(wobblePhase * 2.3) * (4 + s * 8);
      rot = Math.sin(wobblePhase * 1.5) * (1.2 + s * 2);
    }
    const pivotX = 100, pivotY = 148;
    houseGroup.setAttribute(
      "transform",
      "translate(" + dx + "," + dy + ") rotate(" + rot + " " + pivotX + " " + pivotY + ")"
    );
    if (shake) {
      houseState.textContent = "Wackelt — ungelagerter Abschnitt";
      houseState.className = "house-state wobble";
    } else {
      houseState.textContent = "Ruhig — gelagerter Abschnitt";
      houseState.className = "house-state calm";
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    trainX += pxPerSec() * dt;
    const loop = TOTAL_KM * KM_PX;
    if (trainX > loop) trainX -= loop;
    wobblePhase += dt * (2 + kmh() * 0.03);

    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "#1e1c18";
    ctx.fillRect(0, 0, w, h * 0.45);
    ctx.fillStyle = "#252320";
    ctx.fillRect(0, h * 0.45, w, h * 0.55);

    drawTrack(w, h);
    updateHouse(sectionAtX(trainX));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
