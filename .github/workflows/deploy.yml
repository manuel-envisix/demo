name: Deploy ring-demo

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ring-demo-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Stage site bundle
        run: |
          set -euo pipefail
          rm -rf bundle
          mkdir -p bundle/site
          cp index.html regie.html gebaut.html state.json icon.svg bundle/site/
          cp -r assets templates bundle/site/
          cp deployment/docker-compose.yml deployment/nginx.conf bundle/

      - name: Upload to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          source: bundle/docker-compose.yml,bundle/nginx.conf,bundle/site
          target: ~/hosting/ring-demo
          strip_components: 1

      - name: Restart stack
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          script: |
            set -euo pipefail
            cd ~/hosting/ring-demo
            docker compose -p ring-demo up -d --remove-orphans
