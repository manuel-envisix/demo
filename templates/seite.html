<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gebaut</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14120e; color: #f4f0e6; font-family: Georgia, sans-serif; }
  main { height: 100%; display: grid; align-content: center; padding: 8vh 8vw; gap: 2vh; box-sizing: border-box; }
  p { margin: 0; letter-spacing: 0.14em; text-transform: uppercase; color: #f39500; }
  h1 { font-size: clamp(3rem, 7vw, 6.5rem); line-height: 0.95; margin: 0; letter-spacing: -0.04em; }
  .num { font-size: clamp(4rem, 14vw, 11rem); line-height: 0.85; margin: 0; color: #f39500; }
  small { color: #b7b0a4; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <p>Aufgabe</p>
  <h1>Hier steht das Ergebnis.</h1>
</main>
</body>
</html>
